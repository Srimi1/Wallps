name: Bug Report
description: Create a report to help us improve Wallps
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Wallps Version
      description: What version of Wallps are you running? (e.g. 0.1.0 pre-release)
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS Version & Hardware
      description: e.g. macOS 14.6 / macOS 26 on Apple Silicon M3 Max, or Windows 11 on Intel i7
      placeholder: macOS 14.6 Sonoma, Apple Silicon M2 / Windows 11, x64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue.
      placeholder: |
        1. Open Wallps
        2. Set 4K live wallpaper
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
