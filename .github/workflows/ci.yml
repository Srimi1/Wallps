name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Wallps.xcodeproj -scheme Wallps \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build

      - name: Test
        run: |
          xcodebuild -project Wallps.xcodeproj -scheme Wallps \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            test

# Releases need signing and notarization, which fork PRs cannot access secrets
# for. That belongs in a separate tag-triggered workflow once the project has a
# Developer ID — see the roadmap in README.md.
